[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-harness"
version = "0.1.0"
description = "Minimal Harness with adversarial review and Docker gates"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["black>=26.5", "playwright>=1.50"]

[project.scripts]
harness-search = "meta_harness.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 79
