[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-harness"
version = "0.1.0"
description = "Minimal Harness with adversarial review and Docker gates"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["black>=26.5", "playwright>=1.50"]
gui = ["PySide6>=6.7"]
voice = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "miniaudio>=1.61",
]

[project.scripts]
harness-search = "meta_harness.cli:main"
harness-gui = "gui.app:main"
harness-voice = "gui.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["meta_harness*", "gui*"]

[tool.setuptools.package-data]
meta_harness = ["prompts/*.md"]
gui = ["assets/*.png"]

[tool.black]
line-length = 79
