name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==26.10.1 flake8==7.5.0 pycodestyle==2.15.0 pytest==9.2.0
      - name: Install curses on Windows
        if: runner.os == 'Windows'
        run: python -m pip install windows-curses
      - name: Format check
        run: black --check --diff meta_harness tests gui benchmarks scripts setup_app.py .opencode
      - name: Lint
        run: flake8 meta_harness tests gui benchmarks scripts setup_app.py .opencode
      - name: Standard audit
        run: python .opencode/skill/embedded-python-standard/audit_python_standard.py
      - name: Corpus integrity
        run: python -m unittest tests.test_repo_benchmark tests.test_independent_corpus -v
      - name: Compile
        run: python -m compileall -q meta_harness tests gui scripts
      - name: Test
        run: python -m unittest discover -s tests -v
