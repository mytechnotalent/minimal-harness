name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install --upgrade pip black flake8 pycodestyle
      - name: Install curses on Windows
        if: runner.os == 'Windows'
        run: python -m pip install windows-curses
      - name: Format check
        run: black --check meta_harness tests gui benchmarks scripts setup_app.py
      - name: Lint
        run: flake8 meta_harness tests gui benchmarks scripts setup_app.py
      - name: Standard audit
        run: python .opencode/skill/embedded-python-standard/audit_python_standard.py
      - name: Compile
        run: python -m compileall -q meta_harness tests gui scripts
      - name: Test
        run: python -m unittest discover -s tests -v
